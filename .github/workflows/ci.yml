name: MindStop Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run MindStop unit tests and build debug APK
        run: ./gradlew --no-configuration-cache testFullDebugUnitTest --tests 'app.mindstop.*' assembleFullDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindstop-full-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
